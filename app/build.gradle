apply plugin: 'com.android.application'

android {
    compileSdkVersion 25
    buildToolsVersion "25.0.0"
    defaultConfig {
        applicationId "io.github.gohoski.numai"
        minSdkVersion 1
        targetSdkVersion 25
        versionCode 3
        versionName "1.0.0dev"
        setProperty("archivesBaseName", "numAi-$versionName")
    }
    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

}

dependencies {}
